name: Offline release hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check offline release tools
        run: |
          python -m py_compile \
            scripts/generate_output_manifest.py \
            scripts/validate_public_release.py \
            tests/test_public_release_tools.py

      - name: Run offline release-tool tests
        run: python -m unittest tests.test_public_release_tools -v

      - name: Validate curated public boundary
        run: >-
          python scripts/validate_public_release.py
          --public-dir outputs/public
          --require-manifest

      - name: Verify deterministic manifest when present
        shell: bash
        run: |
          if [[ -f outputs/public/manifest.json ]]; then
            python scripts/generate_output_manifest.py \
              --root outputs/public \
              --output outputs/public/manifest.json \
              --check
          fi
